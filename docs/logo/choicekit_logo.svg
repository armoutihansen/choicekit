<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">choicekit logo</title>
  <desc id="desc">Pixel-art decision tree logo with one selected alternative and a choicekit wordmark.</desc>
  <defs>
    <style>
      .mint { fill: #55D982; }
      .navy { fill: #071A2F; }
      .none { fill: none; }
    </style>
  </defs>

  <!-- Transparent background -->

  <!-- Icon: pixel-aligned decision tree -->
  <g transform="translate(0,20)" class="mint" shape-rendering="crispEdges">
    <!-- top square outline -->
    <rect x="448" y="144" width="128" height="24"/>
    <rect x="448" y="168" width="24" height="104"/>
    <rect x="552" y="168" width="24" height="104"/>
    <rect x="448" y="272" width="128" height="24"/>

    <!-- trunk -->
    <rect x="500" y="296" width="24" height="72"/>
    <rect x="476" y="368" width="72" height="24"/>

    <!-- left branch, stepped pixel line -->
    <rect x="452" y="392" width="48" height="24"/>
    <rect x="428" y="416" width="48" height="24"/>
    <rect x="404" y="440" width="48" height="24"/>
    <rect x="380" y="464" width="48" height="24"/>
    <rect x="356" y="488" width="48" height="24"/>
    <rect x="332" y="512" width="48" height="24"/>
    <rect x="308" y="536" width="48" height="24"/>
    <rect x="284" y="560" width="48" height="24"/>

    <!-- right branch, stepped pixel line -->
    <rect x="524" y="392" width="48" height="24"/>
    <rect x="548" y="416" width="48" height="24"/>
    <rect x="572" y="440" width="48" height="24"/>
    <rect x="596" y="464" width="48" height="24"/>
    <rect x="620" y="488" width="48" height="24"/>
    <rect x="644" y="512" width="48" height="24"/>
    <rect x="668" y="536" width="48" height="24"/>
    <rect x="692" y="560" width="48" height="24"/>

    <!-- middle branch -->
    <rect x="500" y="392" width="24" height="168"/>

    <!-- left option square outline -->
    <rect x="240" y="560" width="128" height="24"/>
    <rect x="240" y="584" width="24" height="104"/>
    <rect x="344" y="584" width="24" height="104"/>
    <rect x="240" y="688" width="128" height="24"/>

    <!-- right option square outline -->
    <rect x="656" y="560" width="128" height="24"/>
    <rect x="656" y="584" width="24" height="104"/>
    <rect x="760" y="584" width="24" height="104"/>
    <rect x="656" y="688" width="128" height="24"/>

    <!-- selected middle option square -->
    <rect x="448" y="560" width="128" height="128"/>
  </g>

  <!-- Wordmark built from text; keep editable, simple, and crisp -->
  <text x="512" y="842" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="112" font-weight="700" letter-spacing="-6"
        shape-rendering="crispEdges">
    <tspan class="navy">choice</tspan><tspan class="mint">kit</tspan>
  </text>
</svg>
